spring.application.name=userService
server.port=8081

# --- PostgreSQL (User DB) ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:userdb}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:11553303}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate (schema managed by Liquibase) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=
# spring.data.redis.timeout=60000

# --- Keycloak / OAuth2 resource server ---
# jwk-set-uri is used instead of issuer-uri so the application does not call Keycloak on startup.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/jacapp/protocol/openid-connect/certs}

# --- Keycloak Admin REST API (service account) ---
keycloak.admin.url=${KEYCLOAK_ADMIN_URL:http://localhost:8180}
keycloak.admin.realm=${KEYCLOAK_REALM:jacapp}
keycloak.admin.client-id=${KEYCLOAK_CLIENT_ID:jacapp-backend}
keycloak.admin.client-secret=${KEYCLOAK_CLIENT_SECRET:jacapp-backend-secret}

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=userService-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Liquibase ---
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.profiles.active=local