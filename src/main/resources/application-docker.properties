#PostgreSQL (User DB)
spring.datasource.url=jdbc:postgresql://postgres:5432/userdb
spring.datasource.username=postgres
spring.datasource.password=11553303
spring.datasource.driver-class-name=org.postgresql.Driver

#Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

#Redis
spring.data.redis.host=redis
spring.data.redis.port=6379

# Keycloak / OAuth2
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/jacapp/protocol/openid-connect/certs}
keycloak.admin.url=${KEYCLOAK_ADMIN_URL:http://keycloak:8080}
keycloak.admin.realm=${KEYCLOAK_REALM:jacapp}
keycloak.admin.client-id=${KEYCLOAK_CLIENT_ID:jacapp-backend}
keycloak.admin.client-secret=${KEYCLOAK_CLIENT_SECRET:jacapp-backend-secret}

# Kafka
#spring.kafka.bootstrap-servers=kafka:9092

#Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

#Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true