#PostgreSQL (User DB)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:userdb}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

#Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# Keycloak / OAuth2
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/jacapp/protocol/openid-connect/certs}
keycloak.admin.url=${KEYCLOAK_ADMIN_URL:http://keycloak:8080}
keycloak.admin.realm=${KEYCLOAK_REALM:jacapp}
keycloak.admin.client-id=${KEYCLOAK_CLIENT_ID:jacapp-backend}
keycloak.admin.client-secret=${KEYCLOAK_CLIENT_SECRET}

#Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

#Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
