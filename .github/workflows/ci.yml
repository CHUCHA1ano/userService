name: CI

on:
  push:
    branches: [ UserService, main ]
  pull_request:
    branches: [ UserService, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Integration tests start PostgreSQL and Redis through Testcontainers; the
      # service containers from the previous job setup are no longer needed.
      - name: Build and run all tests (unit + integration, Docker required)
        run: mvn -B verify

      - name: Check SonarCloud secrets
        id: sonar_check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "SONAR_TOKEN secret is not set, skipping SonarCloud analysis"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud analysis
        if: steps.sonar_check.outputs.skip != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.projectKey=CHUCHA1ano_userService
          -Dsonar.organization=chucha1ano
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
          if-no-files-found: ignore

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t user-service:${{ github.sha }} .
